{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Git 发布工作台{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'workbench/app.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'workbench:dashboard' %}">
                <span class="brand-mark">GR</span>
                <span>Git Release Workbench</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'workbench:dashboard' %}">发布工作台</a>
                <a href="{% url 'workbench:repository_create' %}">添加项目</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% if messages %}
            <div class="messages" aria-live="polite">
                {% for message in messages %}
                    <div class="message message-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'workbench/app.js' %}"></script>
</body>
</html>
